    <style>
      @keyframes sail { 0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(8px,-2px) rotate(1deg)} }
      @keyframes glimmer { 0%,100%{stroke-dashoffset:0;opacity:.45}50%{stroke-dashoffset:-48;opacity:.95} }
      @keyframes cloud-drift { 0%{transform:translateX(-24px);opacity:0}20%,80%{opacity:.3}100%{transform:translateX(52px);opacity:0} }
      .ship-one{animation:sail 7s ease-in-out infinite}.route-glimmer{animation:glimmer 9s linear infinite}.cloud{animation:cloud-drift 26s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){.ship-one,.route-glimmer,.cloud{animation:none!important}}
    </style>
